<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | Premium UI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .update-card {
            background: #ffffff;
            border-radius: 24px;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card-header-custom {
            background: #f8f9fa;
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .page-title {
            font-weight: 700;
            color: #d63031; /* Professional Red/Orange for 'Editing' */
            margin: 0;
        }

        .form-body {
            padding: 40px;
        }

        /* Django form styling */
        .mb-3 p {
            margin-bottom: 1.2rem;
            color: #636e72;
            font-weight: 500;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            padding: 12px 15px;
            font-size: 0.95rem;
            border: 2px solid #f1f2f6;
            border-radius: 12px !important;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ff9a9e;
            outline: 0;
            box-shadow: 0 0 0 4px rgba(255, 154, 158, 0.15);
            background-color: #fff;
        }

        .btn-update {
            background: #d63031;
            color: white;
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-update:hover {
            background: #b71c1c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.3);
            color: white;
        }

        .btn-cancel {
            background: #f1f2f6;
            color: #636e72;
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
        }

        .btn-cancel:hover {
            background: #dfe4ea;
            color: #2d3436;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            
            <div class="card update-card">
                <div class="card-header-custom">
                    <span style="font-size: 40px;">📝</span>
                    <h2 class="page-title mt-2">Modify Details</h2>
                    <p class="text-muted small mb-0">Updating records for current employees</p>
                </div>

                <div class="form-body">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-4">
                            {{ form.as_p }}
                        </div>

                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-update">
                                ✅ Save Changes
                            </button>
                            <a href="/referral/" class="btn btn-cancel">
                                Discard Changes
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-center mt-4 text-white-50 small">
                Employee Referral System v2.0
            </p>
        </div>
    </div>
</div>

</body>
</html>
