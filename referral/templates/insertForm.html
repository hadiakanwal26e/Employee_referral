<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMPLOYEE_REFERRAL | Add Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #5f2c82, #49a09d);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .form-title {
            font-weight: 600;
            color: #5f2c82;
        }

        .btn-primary {
            background: linear-gradient(to right, #5f2c82, #49a09d);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        input, select, textarea {
            border-radius: 10px !important;
            padding: 10px;
            border: 1px solid #ccc;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #5f2c82;
            box-shadow: 0 0 0 0.2rem rgba(95,44,130,0.25);
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #5f2c82, #49a09d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            margin: auto;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand fw-bold">EMPLOYEE_REFERRAL</span>
</nav>

<!-- FORM -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card glass-card p-5">

                <div class="text-center mb-4">
                    <div class="icon-circle mb-3">👤</div>
                    <h2 class="form-title">Add New Employee</h2>
                    <p class="text-muted small">Fill in the details below</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        {{ form.as_p }}
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-primary">
                            🚀 Save Employee
                        </button>

                        <a href="/referral/" class="btn btn-outline-secondary">
                            ⬅ Back to List
                        </a>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
